              - paragraph [ref=f2e150]: Estação com sensores de temperatura, umidade e chuva instalada no pátio, com painel que mostra os dados para as turmas de Ciências.
            - generic [ref=f2e151]:
              - heading "O problema" [level=2] [ref=f2e152]
              - paragraph [ref=f2e153]: A escola não tinha registro próprio do clima local. As aulas de Ciências usavam dados de estações distantes, que não representavam o microclima do bairro nem os alagamentos do pátio.
            - generic [ref=f2e154]:
              - heading "Nossa solução" [level=2] [ref=f2e155]
              - paragraph [ref=f2e156]: Montamos uma estação com Arduino, sensores DHT22 e pluviômetro artesanal. Os dados vão para um painel web simples, atualizado a cada dez minutos, com histórico por dia.
            - generic [ref=f2e157]:
              - heading "O que aprendemos" [level=2] [ref=f2e158]
              - paragraph [ref=f2e159]: Aprendemos a calibrar sensores, a lidar com leituras erradas e a explicar os dados para quem não é da área. Também aprendemos a dividir tarefas e a documentar o que foi feito.
