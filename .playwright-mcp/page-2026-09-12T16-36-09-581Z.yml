            - generic [ref=f9e107]:
              - heading "O problema" [level=2] [ref=f9e108]
              - paragraph [ref=f9e109]: A escola não tinha registro próprio do clima local. As aulas de Ciências usavam dados de estações distantes, que não representavam o microclima do bairro nem os alagamentos do pátio.
            - generic [ref=f9e110]:
              - heading "Nossa solução" [level=2] [ref=f9e111]
              - paragraph [ref=f9e112]: Montamos uma estação com Arduino, sensores DHT22 e pluviômetro artesanal. Os dados vão para um painel web simples, atualizado a cada dez minutos, com histórico por dia.
            - generic [ref=f9e113]:
              - heading "O que aprendemos" [level=2] [ref=f9e114]
              - paragraph [ref=f9e115]: Aprendemos a calibrar sensores, a lidar com leituras erradas e a explicar os dados para quem não é da área. Também aprendemos a dividir tarefas e a documentar o que foi feito.
