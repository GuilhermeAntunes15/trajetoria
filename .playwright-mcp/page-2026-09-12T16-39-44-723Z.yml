          - generic [ref=f17e79]:
            - heading "Resumo" [level=2] [ref=f17e80]
            - paragraph [ref=f17e81]: Estação com sensores de temperatura, umidade e chuva instalada no pátio, com painel que mostra os dados para as turmas de Ciências.
          - generic [ref=f17e82]:
            - heading "O problema" [level=2] [ref=f17e83]
            - paragraph [ref=f17e84]: A escola não tinha registro próprio do clima local. As aulas de Ciências usavam dados de estações distantes, que não representavam o microclima do bairro nem os alagamentos do pátio.
          - generic [ref=f17e85]:
            - heading "Nossa solução" [level=2] [ref=f17e86]
            - paragraph [ref=f17e87]: Montamos uma estação com Arduino, sensores DHT22 e pluviômetro artesanal. Os dados vão para um painel web simples, atualizado a cada dez minutos, com histórico por dia.
          - generic [ref=f17e88]:
            - heading "O que aprendemos" [level=2] [ref=f17e89]
            - paragraph [ref=f17e90]: Aprendemos a calibrar sensores, a lidar com leituras erradas e a explicar os dados para quem não é da área. Também aprendemos a dividir tarefas e a documentar o que foi feito.
